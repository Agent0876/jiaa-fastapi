apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiaa-ai-chat-service
  namespace: jiaa-backend
  labels:
    app: jiaa-ai-chat-service
    service: ai-chat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jiaa-ai-chat-service
  template:
    metadata:
      labels:
        app: jiaa-ai-chat-service
        service: ai-chat-service
    spec:
      containers:
      - name: ai-chat-service
        image: jiaa-ai-chat-service:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ENV
          value: "local"
        - name: PORT
          value: "8080"
        - name: EUREKA_SERVER
          value: "http://discovery-service:8761/eureka"
        - name: EUREKA_APP_NAME
          value: "ai-chat-service"
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: JWT_SECRET
          value: "your-jwt-secret-key"
        # MongoDB 연결 설정
        - name: MONGO_HOST
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: MONGO_HOST
        - name: MONGO_PORT
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: MONGO_PORT
        - name: MONGO_DB_NAME
          valueFrom:
            secretKeyRef:
              name: mongodb-credentials
              key: MONGO_DB_NAME
        # MongoDB 인증 (필요한 경우 주석 해제)
        # - name: MONGO_USER
        #   valueFrom:
        #     secretKeyRef:
        #       name: mongodb-credentials
        #       key: MONGO_USER
        # - name: MONGO_PASSWORD
        #   valueFrom:
        #     secretKeyRef:
        #       name: mongodb-credentials
        #       key: MONGO_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jiaa-ai-chat-service-svc
  namespace: jiaa-backend
  labels:
    app: jiaa-ai-chat-service
    service: ai-chat-service
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: jiaa-ai-chat-service

