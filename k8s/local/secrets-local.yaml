apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: jiaa-backend
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "your-access-key-id"
  AWS_SECRET_ACCESS_KEY: "your-secret-access-key"
  AWS_REGION: "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
  namespace: jiaa-backend
type: Opaque
stringData:
  # 호스트의 MongoDB에 연결 (Docker Desktop의 경우 host.docker.internal 사용)
  # Kubernetes 클러스터 내부에 MongoDB가 있는 경우 해당 서비스 이름 사용 (예: mongodb-service)
  MONGO_HOST: "host.docker.internal"
  MONGO_PORT: "27017"
  MONGO_DB_NAME: "jiwon"
  # 인증이 필요한 경우 아래 주석 해제하고 값 설정
  # MONGO_USER: "admin"
  # MONGO_PASSWORD: "yourpassword"

