apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiaa-ai-judge-service
  namespace: jiaa-backend
  labels:
    app: jiaa-ai-judge-service
    service: ai-judge-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jiaa-ai-judge-service
  template:
    metadata:
      labels:
        app: jiaa-ai-judge-service
        service: ai-judge-service
    spec:
      containers:
      - name: ai-judge-service
        image: jiaa-ai-judge-service:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ENV
          value: "local"
        - name: PORT
          value: "8080"
        - name: EUREKA_SERVER
          value: "http://discovery-service:8761/eureka"
        - name: EUREKA_APP_NAME
          value: "ai-judge-service"
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: AWS_REGION
          value: "us-east-1"
        - name: DEFAULT_MODEL_ID
          value: "anthropic.claude-3-haiku-20240307-v1:0"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jiaa-ai-judge-service-svc
  namespace: jiaa-backend
  labels:
    app: jiaa-ai-judge-service
    service: ai-judge-service
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: jiaa-ai-judge-service

