apiVersion: v1
kind: Secret
metadata:
  name: kaniko-docker-config
  namespace: jiaa-backend
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ""  # base64 인코딩된 ECR 인증 정보
---
# 생성 방법:
# 1. ECR 로그인
# aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 541673202749.dkr.ecr.ap-northeast-2.amazonaws.com
#
# 2. Docker config 생성
# cat ~/.docker/config.json | base64 -w 0
#
# 3. 위의 .dockerconfigjson 필드에 base64 값 입력

